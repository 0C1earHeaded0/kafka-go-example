services:
  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181       # Порт для подключения клиентов и брокеров.
      ZOOKEEPER_SERVER_ID: 1            # Уникальный ИД сервера ZooKeeper в кластере.
      ZOOKEEPER_SERVERS: zoo1:2888:3888 # Список всех серверов кластера ZooKeeper
                                        # с их портами для синхронизации данных : выборов лидера.
  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      #
      # Адреса и порты, которые кафка возвращает клиентам.
      # Настроено 3 независимых канала:
      #
      #   INTERNAL://kafka1:19092 - канал общения между брокерами
      # и сервисами одной Docker-сети.
      #   EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092 - канал для кода
      # на хосте.
      #   DOCKER://host.docker.internal:29092 - канал для Docker Desktop (Win/Mac).
      #
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      #
      # Протоколы безопасности сетевых интерфейсов.
      # 
      #   SASL_PLAINTEXT - Аутентификация выполняется по логину и паролю (или токену), 
      # но сам трафик внутри сети не шифруется/
      #   SSL - Трафик между клиентом и Kafka полностью шифруется.
      # Допускается односторонняя и взаимная аутентификация.
      #   PLAINTEXT - Открытый вид передачи трафика.
      #
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      # Интерфейс для взаимодействия между брокерами.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Строка подключения к ZooKeeper.
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      # Уникальный ИД брокера в рамках кластера.
      KAFKA_BROKER_ID: 1
      #
      # Логирование (фреймворк Log4j):
      #
      #   kafka.controller=INFO - логи главного контроллера в режиме INFO.
      #   kafka.producer.async.DefaultEventHandler=INFO - логи при асинхронной
      # обработке событий продюсеров в режиме INFO.
      #   state.change.logger=INFO - логи изменения состояния реплик топиков и
      # партиций (жизненный цикл топиков, партиций и их реплик).
      #
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      # 
      # Включает стандартный механизм контроля доступа.
      # Класс отвечает за проверку прав доступа к топикам. 
      #
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      # Если для топика нет правил ACL, то все имеют к нему доступ.
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zoo1
  kafka2:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9093"
      - "29093:29093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19093,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9093,DOCKER://host.docker.internal:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 2
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zoo1
  kafka3:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9094"
      - "29094:29094"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19094,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9094,DOCKER://host.docker.internal:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 3
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zoo1
  postgres:
    image: postgres:18.2-alpine
    hostname: postgres
    container_name: postgres_eos
    env_file:
      - .env
    ports:
      - "5400:5432"
    volumes:
      - transactions:/var/lib/postgresql/data

volumes:
  transactions:
